<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="38" fill="white" stroke="black" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="40" cy="35" r="20" fill="white" stroke="black" stroke-width="1.5"/>
  
  <!-- Antenna -->
  <line x1="40" y1="15" x2="40" y2="8" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="40" cy="6" r="2" fill="black"/>
  
  <!-- Left eye -->
  <circle cx="33" cy="32" r="2.5" fill="black"/>
  <circle cx="33" cy="32" r="1" fill="white"/>
  
  <!-- Right eye -->
  <circle cx="47" cy="32" r="2.5" fill="black"/>
  <circle cx="47" cy="32" r="1" fill="white"/>
  
  <!-- Smile -->
  <path d="M 32 38 Q 40 42 48 38" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <ellipse cx="40" cy="55" rx="18" ry="15" fill="white" stroke="black" stroke-width="1.5"/>
  
  <!-- Atom symbol on chest -->
  <circle cx="40" cy="55" r="5" fill="none" stroke="black" stroke-width="0.8"/>
  <circle cx="38" cy="55" r="1" fill="black"/>
  <circle cx="40" cy="52" r="1" fill="black"/>
  <circle cx="40" cy="58" r="1" fill="black"/>
  <circle cx="42" cy="55" r="1" fill="black"/>
</svg>
