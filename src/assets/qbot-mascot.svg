<svg viewBox="0 0 140 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Antenna pole -->
  <rect x="67" y="8" width="6" height="35" fill="black" stroke="black" stroke-width="1.5"/>
  
  <!-- Antenna ball -->
  <circle cx="70" cy="5" r="6" fill="white" stroke="black" stroke-width="2"/>
  
  <!-- Motion lines around antenna -->
  <path d="M 50 22 Q 45 18 42 25" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 90 22 Q 95 18 98 25" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Head/Screen -->
  <rect x="30" y="35" width="80" height="60" rx="15" fill="white" stroke="black" stroke-width="2.5"/>
  
  <!-- Screen inner (black area) -->
  <rect x="38" y="43" width="64" height="44" rx="10" fill="black" stroke="black" stroke-width="1"/>
  
  <!-- Left ear -->
  <circle cx="22" cy="55" r="6" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Right ear -->
  <circle cx="118" cy="55" r="6" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Left eye (happy curved) -->
  <path d="M 50 55 Q 50 62 58 62 Q 58 55 50 55" fill="white" stroke="white" stroke-width="1.5"/>
  <path d="M 53 59 Q 56 62 59 59" stroke="black" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Right eye (happy curved) -->
  <path d="M 82 55 Q 82 62 90 62 Q 90 55 82 55" fill="white" stroke="white" stroke-width="1.5"/>
  <path d="M 85 59 Q 88 62 91 59" stroke="black" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Big smile -->
  <path d="M 48 70 Q 70 82 92 70" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Smile laugh lines -->
  <path d="M 44 76 Q 42 80 40 76" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 96 76 Q 98 80 100 76" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Neck -->
  <rect x="58" y="95" width="24" height="10" fill="white" stroke="black" stroke-width="2"/>
  
  <!-- Body/Shirt -->
  <rect x="40" y="105" width="60" height="65" rx="8" fill="white" stroke="black" stroke-width="2.5"/>
  
  <!-- Atom symbol on chest -->
  <circle cx="70" cy="130" r="10" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="64" cy="130" r="1.5" fill="black"/>
  <circle cx="70" cy="122" r="1.5" fill="black"/>
  <circle cx="70" cy="138" r="1.5" fill="black"/>
  <circle cx="76" cy="130" r="1.5" fill="black"/>
  
  <!-- Left arm -->
  <path d="M 40 115 Q 15 125 10 150" stroke="black" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Left hand -->
  <circle cx="8" cy="153" r="8" fill="white" stroke="black" stroke-width="2"/>
  <path d="M 2 148 L -2 142" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 8 147 L 8 138" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 14 148 L 18 142" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Right arm - waving -->
  <path d="M 100 115 Q 125 120 135 135" stroke="black" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Right hand - waving -->
  <circle cx="137" cy="138" r="8" fill="white" stroke="black" stroke-width="2"/>
  <path d="M 131 133 L 127 127" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 137 132 L 137 123" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 143 133 L 147 127" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Wave motion indicator -->
  <path d="M 145 120 Q 148 117 151 120" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 148 112 Q 151 109 154 112" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
